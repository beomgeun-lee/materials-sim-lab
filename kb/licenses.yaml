# 라이선스 정책 표 — 소스(sources.yaml)와 엔진(engines.yaml)은 여기 id 로만 라이선스를 적는다.
#
# 파티션 규칙 (msl.registry.models.LicenseEntry.partition):
#   open       = 상업 이용 true, 재배포 true, 변경금지 아님 → 배포 빌드에 넣을 수 있다
#   restricted = 그 밖의 전부 (모르는 것(null)도 restricted) → 연구용 파티션에만 둔다
# copyleft 규칙 (engines.yaml 검사):
#   strong(GPL)   → isolation 이 worker / excluded / reference-only 여야 한다
#   network(AGPL) → 제품(product)에서 쓸 수 없다
# 동일조건: SA 와, 데이터에 붙은 GPL 은 파생물에 같은 라이선스를 요구한다 (same_license_required)
#
# 이 표를 고칠 때는 근거(url·note)를 함께 적는다. 법률 자문이 아니다.

# ── 퍼블릭 도메인·자유 이용 ─────────────────────────────────────────────
- id: CC0-1.0
  name: Creative Commons Zero 1.0
  commercial_use: true
  redistribution: true
  url: https://creativecommons.org/publicdomain/zero/1.0/

- id: public-domain
  name: 퍼블릭 도메인 (미국 연방정부 저작물 등)
  commercial_use: true
  redistribution: true
  note: 17 U.S.C. §105. 제3자 저작물이 섞인 데이터는 해당 부분 제외

- id: USGS-public
  name: USGS 소프트웨어·데이터 이용 조건
  commercial_use: true
  redistribution: true
  note: 자유 이용·재배포, 수정 시 수정 사실 고지 (PHREEQC 등)

- id: KR-datagokr-unrestricted
  name: 공공데이터포털 '이용허락범위 제한 없음'
  commercial_use: true
  redistribution: true
  note: 기관 자체 약관이 따로 있으면 그쪽을 확인한다 (예 KOSHA MSDS 는 문구 상충 → unknown 처리)

