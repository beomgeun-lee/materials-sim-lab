      - {commodity: Titanium Mineral Concentrates, label: 금홍석 광산, production: "Mine production: Rutile"}
      - {commodity: Titanium Sponge Metal, label: 스펀지 금속, production: Titanium sponge metal production}
  V:
    name: 바나듐
