  Ho: {name: 홀뮴, critical: Holmium, stages: [{commodity: Rare Earths, label: 희토류 광산, production: Mine production, nir: Compounds and metals}]}
  Er: {name: 어븀, critical: Erbium, stages: [{commodity: Rare Earths, label: 희토류 광산, production: Mine production, nir: Compounds and metals}]}
  Tm: {name: 툴륨, critical: Thulium, stages: [{commodity: Rare Earths, label: 희토류 광산, production: Mine production, nir: Compounds and metals}]}
