    critical: Manganese
    stages:
      - {commodity: Manganese, label: 광산, production: Mine production}
  Fe:
    name: 철
    world_bank: "Iron ore, cfr spot"
    stages:
      - {commodity: Iron Ore, label: 철광석(철 함량), production: "Mine production: Iron content"}
  Co:
    name: 코발트
    critical: Cobalt
    stages:
      - {commodity: Cobalt, label: 광산, production: Mine production}
  Ni:
    name: 니켈
    critical: Nickel
    world_bank: Nickel
    stages:
