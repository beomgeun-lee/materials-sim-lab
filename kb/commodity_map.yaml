  La: {name: 란타넘, critical: Lanthanum, stages: [{commodity: Rare Earths, label: 희토류 광산, production: Mine production, nir: Compounds and metals}]}
  Ce: {name: 세륨, critical: Cerium, stages: [{commodity: Rare Earths, label: 희토류 광산, production: Mine production, nir: Compounds and metals}]}
  Pr: {name: 프라세오디뮴, critical: Praseodymium, stages: [{commodity: Rare Earths, label: 희토류 광산, production: Mine production, nir: Compounds and metals}]}
