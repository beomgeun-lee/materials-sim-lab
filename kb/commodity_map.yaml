# 원소 → 공급 품목 매핑 (A9 공급·경제성, msl.assays.supply)
#
# 원소마다
#   name:        한글 이름 (리포트 표시)
#   critical:    USGS 2025 핵심광물 목록의 이름 (critical_minerals.mineral). 목록에 없으면 생략
#   world_bank:  World Bank Pink Sheet 품목 (commodity_prices.commodity). 가격 없으면 생략
#   stages:      공급 단계 목록 — USGS MCS 2026 품목 (commodity_stats.commodity)
#     commodity:   MCS 품목명
#     label:       단계 이름 (광산·제련 등)
#     production:  세계 생산 표의 measure_detail (국가 행 기준. 세계 합계 행은 뒤에 ', rounded'·': rounded' 가 붙음)
#                  생략하면 생산 집중도를 계산하지 않는다 (국가별 표가 없거나 항목이 제각각인 품목)
#     nir:         미국 순수입 의존도 행이 여러 개일 때 고를 measure_detail 부분 문자열
#
# 제외 원소 (공급 위험 평가 대상 아님): 아래 exclude
# MCS 품목명은 CSV 표기 그대로다 (대소문자 포함). 확인: uv run msl db status → commodity_stats

exclude: [H, C, N, O, Cl, Ne, Ar, Kr, Xe]

elements:
  Li:
    name: 리튬
    critical: Lithium
    stages:
      - {commodity: Lithium, label: 광산, production: Mine production}
  Be:
    name: 베릴륨
    critical: Beryllium
    stages:
      - {commodity: Beryllium, label: 광산, production: Mine production}
  B:
    name: 붕소
    critical: Boron
    stages:
      - {commodity: Boron, label: 붕산염}  # 국가마다 생산 항목(정제 붕산염·원광 등)이 달라 집중도 생략
  F:
    name: 플루오린
    critical: Fluorspar
    stages:
      - {commodity: Fluorspar, label: 형석 광산, production: Mine production}
  Na:
    name: 나트륨
    stages:
      - {commodity: Salt, label: 소금, production: Mine production}
  Mg:
    name: 마그네슘
    critical: Magnesium
    stages:
      - {commodity: Magnesium Metal, label: 금속 제련, production: Smelter production}
      - {commodity: Magnesium Compounds, label: 마그네사이트 광산, production: Mine production}
  Al:
    name: 알루미늄
    critical: Aluminum
    world_bank: Aluminum
    stages:
      - {commodity: Bauxite, label: 보크사이트 광산, production: "Bauxite, mine production"}
      - {commodity: Alumina, label: 알루미나 정련, production: "Alumina, refinery production"}
      - {commodity: Aluminum, label: 금속 제련, production: Smelter production}
  Si:
    name: 규소
    critical: Silicon
    stages:
      - {commodity: Silicon, label: 금속 규소, production: Silicon metal, nir: Silicon metal}
      - {commodity: Silicon, label: 페로실리콘, production: Ferrosilicon, nir: Ferrosilicon}
  P:
    name: 인
    critical: Phosphate Rock
    world_bank: Phosphate rock
    stages:
      - {commodity: Phosphate Rock, label: 인광석, production: Mine production}
  S:
    name: 황
    stages:
      - {commodity: Sulfur, label: 전 형태, production: "Production, all forms"}
  K:
    name: 칼륨
    critical: Potash
    world_bank: Potassium chloride
    stages:
      - {commodity: Potash, label: 칼리 광산, production: Mine production}
  Ca:
    name: 칼슘
    stages:
      - {commodity: Lime, label: 석회, production: Production}
  Sc:
    name: 스칸듐
    critical: Scandium
    stages:
