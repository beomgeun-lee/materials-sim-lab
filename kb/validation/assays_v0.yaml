# ── A1 조성 안정성 ───────────────────────────────────────────────────────
- id: a1-corundum-stable
  assay: A1
  recipe: {id: rcp-v-a1-1, name: 알루미나, components: [{ref: "formula:Al2O3", amount: 1 mol, state: solid}, {ref: "formula:MgO", amount: 1 mol, state: solid}]}
  checks: [{value_between: {name: "Al2O3 E_hull", range: [0, 1]}}, {value_between: {name: "MgO E_hull", range: [0, 1]}}]

- id: a1-calcite-aragonite-polymorph
  assay: A1
  recipe: {id: rcp-v-a1-2, name: 방해석+아라고나이트, components: [{ref: "mineral:calcite", amount: 1 mol, state: solid}, {ref: "mineral:aragonite", amount: 1 mol, state: solid}]}
  checks: [{value_between: {name: "Calcite (CaCO3) E_hull", range: [0, 1]}}, {value_between: {name: "Aragonite (CaCO3) E_hull", range: [0.5, 60]}}]  # 상압에서 아라고나이트는 준안정 (크기는 GGA 가 과대평가)

# ── A2 고상·계면 반응 ────────────────────────────────────────────────────
- id: a2-spinel
  assay: A2
  recipe: {id: rcp-v-a2-1, name: MgO+Al2O3, components: [{ref: "formula:MgO", amount: 1 mol, state: solid}, {ref: "formula:Al2O3", amount: 1 mol, state: solid}], conditions: {T: 1400 °C}}
  checks: [{curve_min_below: -1}, {product_contains: MgAl2O4}]
- id: a2-wollastonite
  assay: A2
  recipe: {id: rcp-v-a2-2, name: 석회석+석영, components: [{ref: "formula:CaCO3", amount: 1 mol, state: solid}, {ref: "formula:SiO2", amount: 1 mol, state: solid}], conditions: {T: 1000 °C}}
  checks: [{curve_min_below: -1}, {product_contains: [CaSiO3, Ca2SiO4, Ca3Si2O7, Ca3SiO5]}, {recipe_products_contains: CaSiO3}]
- id: a2-barium-titanate
  assay: A2
  recipe: {id: rcp-v-a2-3, name: BaCO3+TiO2, components: [{ref: "formula:BaCO3", amount: 1 mol, state: solid}, {ref: "formula:TiO2", amount: 1 mol, state: solid}], conditions: {T: 1100 °C}}
  checks: [{curve_min_below: -1}, {recipe_products_contains: BaTiO3}]  # 1:1 레시피 → BaTiO3 (곡선 최저점은 BaTi2O5 로 0.7 meV 차이)
- id: a2-franklinite
  assay: A2
  recipe: {id: rcp-v-a2-4, name: ZnO+Fe2O3, components: [{ref: "formula:ZnO", amount: 1 mol, state: solid}, {ref: "formula:Fe2O3", amount: 1 mol, state: solid}], conditions: {T: 1000 °C}}
  checks: [{curve_min_below: -1}, {product_contains: ZnFe2O4}]
- id: a2-nickel-aluminate
  assay: A2
  recipe: {id: rcp-v-a2-5, name: NiO+Al2O3, components: [{ref: "formula:NiO", amount: 1 mol, state: solid}, {ref: "formula:Al2O3", amount: 1 mol, state: solid}], conditions: {T: 1300 °C}}
  checks: [{curve_min_below: -1}, {product_contains: NiAl2O4}]
- id: a2-gold-silica-negative
  assay: A2
  recipe: {id: rcp-v-a2-6, name: Au+SiO2, components: [{ref: "element:Au", amount: 1 mol, state: solid}, {ref: "formula:SiO2", amount: 1 mol, state: solid}], conditions: {T: 1000 °C}}
  checks: [{curve_min_above: -1}]

# ── A3 기체 평형 ─────────────────────────────────────────────────────────
- id: a3-methane-air
  assay: A3
  recipe: {id: rcp-v-a3-1, name: 메탄+공기, components: [{ref: "cas:74-82-8", amount: 1 mol, state: gas}, {ref: "cas:7782-44-7", amount: 2 mol, state: gas}, {ref: "cas:7727-37-9", amount: 7.52 mol, state: gas}], conditions: {T: 25 °C}}
  checks: [{value_between: {name: "단열 평형 온도", range: [2200, 2250]}}]
- id: a3-hydrogen-oxygen
  assay: A3
  recipe: {id: rcp-v-a3-2, name: 수소+산소, components: [{ref: "cas:1333-74-0", amount: 2 mol, state: gas}, {ref: "cas:7782-44-7", amount: 1 mol, state: gas}], conditions: {T: 25 °C}}
  checks: [{value_between: {name: "단열 평형 온도", range: [2950, 3200]}}]

# ── A4 수용액 평형 ───────────────────────────────────────────────────────
- id: a4-calcite-water
  assay: A4
  recipe: {id: rcp-v-a4-1, name: 방해석+물, components: [{ref: "mineral:calcite", amount: 1 g, state: solid}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {T: 25 °C, atmosphere: air}}
  checks: [{value_between: {name: "pH", range: [8.1, 8.35]}}]
- id: a4-hydrochloric-acid
  assay: A4
  recipe: {id: rcp-v-a4-2, name: 0.1 M 염산, components: [{ref: "cas:7647-01-0", amount: 0.1 mol, state: aqueous}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {T: 25 °C}}
  checks: [{value_between: {name: "pH", range: [0.95, 1.2]}}]
- id: a4-salt-water
  assay: A4
  recipe: {id: rcp-v-a4-3, name: 소금물, components: [{ref: "cas:7647-14-5", amount: 0.1 mol, state: aqueous}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {T: 25 °C}}
  checks: [{value_between: {name: "pH", range: [6.5, 7.5]}}]
# 락스(차아염소산나트륨) — phreeqc.dat 에 Cl(+1) 이 없어 llnl.dat (D27). 0.05 M NaOCl: pKa(HOCl) 7.5 → pH 약 10
- id: a4-bleach
  assay: A4
  recipe: {id: rcp-v-a4-4, name: 락스 0.05 M, components: [{ref: "cas:7681-52-9", amount: 0.05 mol, state: aqueous}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {T: 25 °C}}
  checks: [{value_between: {name: "pH", range: [9.8, 10.4]}}]
# 락스 + 염산 → HOCl + H⁺ + Cl⁻ ⇌ Cl₂(g), K ≈ 10^4.55 → 0.05 M 락스 + 0.1 M 염산이면 평형 분압 약 5 atm (대기압 초과 = 기체 발생)
- id: a4-bleach-hcl-chlorine
  assay: A4
  recipe: {id: rcp-v-a4-5, name: 락스 + 염산, components: [{ref: "cas:7681-52-9", amount: 0.05 mol, state: aqueous}, {ref: "cas:7647-01-0", amount: 0.1 mol, state: aqueous}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {T: 25 °C}}
  checks: [{value_between: {name: "염소 기체 평형 분압 log₁₀", range: [0.3, 1.2]}}]

