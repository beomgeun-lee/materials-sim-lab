# 검증 세트 v0 — 계획서 7절. 결과가 알려진 조합으로 시험 전체를 점검한다.
# 기준(8절): S0 위험 사례(hazard: true) 재현율 100%, 나머지 통과율 90% 이상.   실행: uv run msl validate
# checks: status_in · verdict_in · value_between{name,range} · value_contains{name,text} · summary_contains ·
#         table_contains · curve_min_below · curve_min_above · product_contains(A2 곡선 최저점 생성물) ·
#         recipe_products_contains(A2 레시피 혼합비의 평형 생성물)

