- id: a5-hematite-acid
  assay: A5
  recipe: {id: rcp-v-a5-11, name: 적철석 pH1(공기), components: [{ref: "formula:Fe2O3", amount: 1 g, state: solid}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {pH: 1, atmosphere: air}}
