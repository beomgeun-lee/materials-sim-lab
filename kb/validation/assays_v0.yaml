- id: a5-copper-deaerated
  assay: A5
  recipe: {id: rcp-v-a5-5, name: 구리 중성(탈기), components: [{ref: "element:Cu", amount: 1 g, state: solid}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {pH: 7, atmosphere: N2}}
  checks: [{summary_contains: "탈기 면역"}]
- id: a5-copper-acid-aerated
  assay: A5
  recipe: {id: rcp-v-a5-6, name: 구리 pH1(공기), components: [{ref: "element:Cu", amount: 1 g, state: solid}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {pH: 1, atmosphere: air}}
  checks: [{summary_contains: "공기 포화 부식(Cu²⁺"}]
- id: a5-aluminum-neutral
  assay: A5
  recipe: {id: rcp-v-a5-7, name: 알루미늄 중성(공기), components: [{ref: "element:Al", amount: 1 g, state: solid}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {pH: 7, atmosphere: air}}
  checks: [{summary_contains: "공기 포화 부동태"}]
- id: a5-aluminum-naoh
  assay: A5
  recipe: {id: rcp-v-a5-8, name: 알루미늄+0.1M NaOH, components: [{ref: "element:Al", amount: 1 g, state: solid}, {ref: "cas:1310-73-2", amount: 0.1 mol/L, state: aqueous}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}]}
  checks: [{value_between: {name: "pH", range: [12.6, 13.1]}}, {summary_contains: "부식(Al(OH)₄⁻"}]
- id: a5-zinc-neutral
  assay: A5
  recipe: {id: rcp-v-a5-9, name: 아연 중성(공기), components: [{ref: "element:Zn", amount: 1 g, state: solid}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {pH: 7, atmosphere: air}}
  checks: [{summary_contains: "공기 포화 부식(Zn²⁺"}]
- id: a5-magnesium-alkaline
  assay: A5
  note: Mg(OH)₂ 석출 pH (Ksp 5.6e-12, Mg²⁺ 10⁻⁶ M → pH 11.4) 위 — MP 원본 에너지로는 MgOH⁺ 부식으로 틀린다 (D15)
  recipe: {id: rcp-v-a5-10, name: 마그네슘 pH12 0V, components: [{ref: "element:Mg", amount: 1 g, state: solid}, {ref: "cas:7732-18-5", amount: 1 L, state: liquid}], conditions: {pH: 12, Eh: 0}}
