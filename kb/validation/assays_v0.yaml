- id: a6-cupronickel-70-30
  assay: A6
  recipe: {id: rcp-v-a6-1, name: Cu-Ni 70/30, components: [{ref: "element:Cu", amount: 70 at%, state: solid}, {ref: "element:Ni", amount: 30 at%, state: solid}], conditions: {P: 1 atm}, sweep: {param: T, start: 1300 K, stop: 1600 K, steps: 31}}
