  compute: [laptop]
  fit: 상
  role: L0/L2 결과를 판정하는 공통 코어 (E_hull·분해 생성물·Pourbaix·계면 반응·치환 구조 생성)
  caveats: 0 K DFT 기준. 유한온도는 GibbsComputedStructureEntry(Bartel 기술자) 근사로 보정. 에너지 기준(GGA/GGA+U/r2SCAN) 혼합은 MP2020 보정 체계를 따르고, 기준이 다른 값을 한 hull 에 섞지 않는다
  refs:
    - https://pypi.org/pypi/pymatgen/json
  checked: 2026-09-26

