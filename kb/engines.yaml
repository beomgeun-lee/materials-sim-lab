# 엔진·모델 레지스트리 — 계획서 3·5장. 근거는 docs/00-조사/02-시뮬레이션-엔진.md (조사일 2026-09-26).
#
# 라이선스는 licenses.yaml id 로만 적는다. 모델(kind=model)은 코드와 가중치 라이선스를 따로 적는다.
# 정책 (msl registry check 가 강제):
#   GPL(copyleft strong)         → isolation: worker (sim-worker-gpl 컨테이너, CLI·파일 I/O 로만 호출)
#   AGPL                         → isolation: excluded, allowed_in: [research]
#   비상업(ASL·academic-only 등)  → allowed_in: [research]
#   상용(kind=commercial)         → isolation: reference-only, code_license: proprietary
# 이 파일의 운영 규칙 (검사기 밖):
#   라이선스 미확인(unknown)과 벤더 약관(FAIR Chemistry·OMat24)은 법무 확인 전까지 allowed_in: [research]
#   fit 은 조사 문서 적합도. 범위(하~중 등)는 낮은 쪽을 적고 role 에 원래 범위를 남긴다
#   version 은 조사 문서 표기 그대로, released 는 일(日)까지 적힌 경우만 채운다
#
# 법률 자문이 아니다. 배포 전에 법무 검토가 필요하다.

# ── 안정성·상평형 ────────────────────────────────────────────────────────
