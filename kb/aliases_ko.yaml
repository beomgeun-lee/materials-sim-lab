# 국문 관용명 → CAS — 해석기 name: 참조가 KOSHA 목록(정식 이름)보다 먼저 본다.
#
# KOSHA MSDS 목록은 정식 이름만 있어 '염산'(정식: 염화수소), '가성소다'(수산화나트륨) 같은 흔한 이름을 찾지 못한다.
# 여기에는 뜻이 하나로 정해지는 관용명만 적는다. formula 는 PubChem 이 돌려주는 화학식과 같은지 테스트로 확인한다.
# 용액 이름(염산·암모니아수)은 용질의 CAS 를 가리킨다 — 농도는 레시피의 양·물로 정한다.
# state 는 웹 작업대에서 성분을 추가할 때의 기본 상태다 (레시피에서 바꿀 수 있다).

