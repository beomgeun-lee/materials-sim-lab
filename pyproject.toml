[project]
name = "msl"
version = "0.0.1"
description = "materials-sim-lab: 원소·광물·화학물질 조합 시뮬레이션 프레임워크"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cantera>=3.2.0",
    "certifi>=2026.7.22",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "mcp>=2.2",
    "mendeleev>=1.3.0",
    "mp-api>=0.46.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "periodictable>=2.1.0",
    "phreeqpython>=1.6.2",
    "pyarrow>=25.0.1",
    "pycalphad>=0.11.2",
    "pydantic>=2.8",
    "pymatgen>=2026.9.24",
    "pyyaml>=6.0",
    "scheil>=0.3.0",
    "scikit-learn>=1.9.1",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
msl = "msl.cli:app"

[project.optional-dependencies]
l2 = [
    "mace-torch>=0.3.16",
    "orb-models>=0.7.0",
    "phonopy>=4.7.1",
]
bo = [
    "baybe>=0.15.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
